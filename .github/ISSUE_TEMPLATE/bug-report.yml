name: Bug report
description: Report plugin incompatibilities or other server-side issues.
labels:
  - bug
  - pending
body:
  - type: markdown
    attributes:
      value: |
        Describe the issue clearly. Confirm it is a server-side bug, not vanilla or client behavior.
  - type: input
    id: wind-version
    attributes:
      label: Wind version
      description: Run `/version` and paste the full, unmodified output.
      placeholder: 'e.g. git-Wind-"fa1ab90" (MC: 1.21.8)'
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include detailed steps, screenshots, videos, or schematics where useful.
    validations:
      required: true
  - type: textarea
    id: plugin-list
    attributes:
      label: Plugins and datapacks
      description: Run `/plugins` and `/datapack list`, then paste both outputs.
    validations:
      required: true
  - type: textarea
    id: config-file-list
    attributes:
      label: Configuration files
      description: Attach relevant files from `spigot.yml`, `bukkit.yml`, `config/`, `luminol_config/`, `lophine_config/`, and `wind_config/` when possible.
  - type: textarea
    id: other
    attributes:
      label: Additional information
