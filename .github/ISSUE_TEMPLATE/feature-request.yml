name: Feature request
description: Suggest an idea for Wind.
labels:
  - enhancement
  - pending
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting a request. Use the latest Wind build and explain the use case clearly.
  - type: textarea
    id: feature
    attributes:
      label: Requested feature
      description: Describe the feature and the problem it would solve.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Additional context
      description: Add any other context or screenshots.
